plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.phonecanlogger'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.phonecanlogger'
        minSdk 29        // Android 10+: lets us save to Downloads without storage permissions
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
